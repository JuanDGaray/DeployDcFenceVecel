{% extends "base.html" %}
{% block title %}Access restricted{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="card border-0 shadow-sm mx-auto" style="max-width: 520px;">
        <div class="card-body p-4 text-center">
            <i class="bi bi-shield-lock text-warning" style="font-size: 2rem;"></i>

    </div>
</div>
{% endblock %}
